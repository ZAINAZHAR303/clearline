<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearline</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --ink:#e6e9ef; --dim:#8a92a6;
    --accent:#6ea8fe; --block:#ff6b6b; --clear:#51cf66; --escalate:#ffd43b;
    --branch:#c084fc; --engine:#4dd4ac;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:12px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:18px; }
  header h1 { font-size:15px; margin:0; letter-spacing:.3px; }
  .tabs { display:flex; gap:4px; margin-left:8px; }
  .tab { padding:5px 13px; border-radius:7px; cursor:pointer; color:var(--dim); font-size:13px; }
  .tab:hover { background:var(--panel); }
  .tab.on { background:var(--panel); color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent); }
  .who { margin-left:auto; display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12.5px; }
  .who input { background:#12151c; border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:4px 9px; font:inherit; font-size:12.5px; width:120px; }

  .pill { font-size:10.5px; font-weight:700; letter-spacing:.6px; padding:2px 7px;
    border-radius:99px; white-space:nowrap; }
  .BLOCK{background:rgba(255,107,107,.16);color:var(--block)}
  .CLEAR{background:rgba(81,207,102,.16);color:var(--clear)}
  .ESCALATE{background:rgba(255,212,59,.16);color:var(--escalate)}
  .NOT_FOUND,.None{background:#2a2f3a;color:var(--dim)}

  /* ---- queue ---- */
  #queue { padding:22px 26px 70px; max-width:1050px; }
  .counts { display:flex; gap:30px; margin-bottom:8px; flex-wrap:wrap; }
  .c .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.7px; }
  .c .v { font-size:24px; font-weight:600; }
  .lede { color:var(--dim); margin:14px 0 18px; }
  .lede b { color:var(--ink); }
  .case { border:1px solid var(--line); border-radius:10px; background:var(--panel);
    padding:15px 17px; margin-bottom:12px; }
  .case .top { display:flex; gap:12px; align-items:baseline; }
  .case .name { font-weight:600; font-size:15px; }
  .case .sub { color:var(--dim); font-size:12.5px; margin-left:auto; text-align:right; }
  .case .head { margin:7px 0 2px; }
  .case .q { color:var(--dim); font-size:13px; margin-top:6px; }
  .acts { display:flex; gap:8px; margin-top:12px; align-items:center; }
  button { font:inherit; font-size:13px; border-radius:7px; padding:6px 14px; cursor:pointer;
    border:1px solid var(--line); background:#1e222b; color:var(--ink); }
  button:hover { border-color:var(--accent); }
  button.primary { background:rgba(110,168,254,.14); border-color:rgba(110,168,254,.4); }
  button.danger { background:rgba(255,107,107,.12); border-color:rgba(255,107,107,.35); }
  button:disabled { opacity:.45; cursor:default; border-color:var(--line); }
  .done { color:var(--clear); font-size:12.5px; }
  details.ev { margin-top:9px; }
  details.ev summary { cursor:pointer; color:var(--dim); font-size:12.5px; }
  details.ev ul { margin:7px 0 0; padding-left:18px; }
  details.ev li { margin:3px 0; font-size:13px; }
  .src { color:var(--dim); font-size:11.5px; }
  .restful { color:var(--dim); border-top:1px solid var(--line); margin-top:22px; padding-top:16px; }
  .empty { color:var(--dim); padding:34px 0; }
  code { background:#1e222b; padding:1px 6px; border-radius:4px; font-size:12.5px; }

  /* ---- traces ---- */
  #traces { display:none; grid-template-columns:330px 1fr; height:calc(100vh - 50px); }
  .runs { border-right:1px solid var(--line); overflow-y:auto; }
  .run { padding:11px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .run:hover { background:var(--panel); }
  .run.active { background:var(--panel); box-shadow:inset 3px 0 0 var(--accent); }
  .run .trow { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .run .meta { color:var(--dim); font-size:12px; margin-top:3px; }
  main { overflow-y:auto; padding:20px 26px 60px; }
  .stats { display:flex; flex-wrap:wrap; gap:26px; margin:4px 0 22px; }
  .stat .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.7px; }
  .stat .v { font-size:19px; font-weight:600; }
  .ev2 { display:grid; grid-template-columns:58px 1fr; gap:12px; padding:5px 0; }
  .t { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px; text-align:right; padding-top:2px; }
  .body { border-left:2px solid var(--line); padding:2px 0 2px 14px; }
  .agent>.body{border-left-color:var(--accent)} .branch>.body{border-left-color:var(--branch)}
  .engine>.body{border-left-color:var(--engine)}
  .label { font-size:10.5px; letter-spacing:.7px; text-transform:uppercase; color:var(--dim); }
  .agent .label{color:var(--accent)} .branch .label{color:var(--branch)} .engine .label{color:var(--engine)}
  .why { color:var(--dim); font-size:13px; }
  pre { background:#12151c; border:1px solid var(--line); border-radius:6px; padding:10px;
    overflow-x:auto; font-size:12px; }
  .legend {
    display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    padding: 9px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel); font-size: 12.5px; color: var(--dim);
  }
  .legend b { color: var(--ink); font-weight: 600; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 3px; height: 13px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>Clearline</h1>
  <div class="tabs">
    <div class="tab on" data-view="queue">Review queue</div>
    <div class="tab" data-view="traces">Traces</div>
  </div>
  <div class="who">reviewer <input id="who" value="" placeholder="your name"></div>
</header>

<div class="legend" id="legend"></div>

<div id="queue"><div class="empty">loading…</div></div>
<div id="traces">
  <div class="runs"></div>
  <main><div class="empty">Select a run.</div></main>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => n ? "$" + Number(n).toLocaleString() : "—";
const who = () => document.getElementById("who").value.trim() || "unnamed-reviewer";
try { document.getElementById("who").value = localStorage.getItem("cl_who") || ""; } catch {}
document.getElementById("who").addEventListener("change", e => {
  try { localStorage.setItem("cl_who", e.target.value); } catch {}
});

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  const q = t.dataset.view === "queue";
  document.getElementById("queue").style.display = q ? "block" : "none";
  document.getElementById("traces").style.display = q ? "none" : "grid";
  if (!q && !runsLoaded) loadRuns();
});

// ---------- review queue ----------
async function loadQueue() {
  const el = document.getElementById("queue");
  const q = await (await fetch("/api/queue")).json();
  if (q.empty) {
    el.innerHTML = `<div class="empty">No sweep yet. Run:<br><br>
      <code>python -m clearline.batch --fake</code></div>`;
    return;
  }
  const needs = q.needs_attention || [];
  const book = q.book || {}, tri = q.triage || {}, dec = q.decisions || {},
        exp = q.exposure || {}, cost = q.cost || {};
  const pct = tri.share_reviewed != null ? Math.round(tri.share_reviewed * 100) + "%" : "—";
  el.innerHTML = `
    <div class="counts">
      <div class="c"><div class="k">Vendor book</div><div class="v">${book.vendors ?? "—"}</div></div>
      <div class="c"><div class="k">Need you</div><div class="v" style="color:var(--block)">${needs.length}</div></div>
      <div class="c"><div class="k">Reviewed</div><div class="v">${pct}</div></div>
      <div class="c"><div class="k">Blocked</div><div class="v">${dec.BLOCK||0}</div></div>
      <div class="c"><div class="k">Escalated</div><div class="v">${dec.ESCALATE||0}</div></div>
      <div class="c"><div class="k">Spend needing action</div><div class="v">${money(exp.spend_needing_action_usd)}</div></div>
      <div class="c"><div class="k">Sweep</div><div class="v">${cost.wall_clock_seconds ?? "—"}s</div></div>
    </div>
    <div class="lede">Of <b>${book.vendors ?? "?"}</b> vendors, <b>${needs.length}</b> need a human.
      Triage cleared <b>${tri.cleared_without_review ?? 0}</b> without deliberation in
      ${tri.seconds ?? 0}s — the rest is where reasoning was actually spent.</div>
    ${needs.map(caseCard).join("")}
    <div class="restful">${esc(q.report_file || "")} · swept ${esc(q.generated_at || "")} ·
      mode ${esc(q.mode || "?")} · ${cost.llm_calls ?? 0} LLM calls,
      ${(cost.reasoning_tokens ?? 0).toLocaleString()} reasoning tokens.
      Cleared vendors are a number, not a list — a queue you must read in full is not a queue.</div>`;
  wire();
}

function caseCard(r) {
  const reasons = (r.triage_reasons || []).map(x => `<li>${esc(x)}</li>`).join("");
  return `<div class="case" data-vendor="${esc(r.vendor_id)}" data-trace="${esc(r.trace || "")}">
    <div class="top">
      <span class="pill ${esc(r.decision)}">${esc(r.decision)}</span>
      <span class="name">${esc(r.legal_name)}</span>
      <span class="sub">${esc(r.country || "")} · ${money(r.annual_spend_usd)}/yr<br>${esc(r.vendor_id)}</span>
    </div>
    <div class="head">${esc(r.rationale || "")}</div>
    ${r.human_question ? `<div class="q">Asks you: ${esc(r.human_question)}</div>` : ""}
    ${reasons ? `<details class="ev"><summary>Why this reached you (${(r.triage_reasons||[]).length})</summary>
       <ul>${reasons}</ul></details>` : ""}
    <div class="acts">
      <button class="primary act" data-action="approve">Approve</button>
      <button class="danger act" data-action="override">Wrong match</button>
      <button class="trace" data-trace="${esc(r.trace || "")}">See how it decided</button>
      <span class="done" style="display:none"></span>
    </div></div>`;
}

function wire() {
  document.querySelectorAll(".act").forEach(b => b.onclick = async () => {
    const card = b.closest(".case");
    const body = { vendor_id: card.dataset.vendor, trace: card.dataset.trace,
                   action: b.dataset.action, reviewer: who() };
    card.querySelectorAll("button").forEach(x => x.disabled = true);
    const note = card.querySelector(".done");
    note.style.display = "inline"; note.textContent = "saving…";
    try {
      const res = await fetch("/api/decide", { method:"POST",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
      const out = await res.json();
      note.textContent = res.ok
        ? (body.action === "override"
            ? `recorded by ${body.reviewer} — this match will not be asserted again`
            : `approved by ${body.reviewer} — recorded in the trust ledger`)
        : `failed: ${out.detail || res.status}`;
      if (!res.ok) card.querySelectorAll("button").forEach(x => x.disabled = false);
    } catch (e) {
      note.textContent = "failed: " + e.message;
      card.querySelectorAll("button").forEach(x => x.disabled = false);
    }
  });
  document.querySelectorAll(".trace").forEach(b => b.onclick = async () => {
    document.querySelector('.tab[data-view="traces"]').click();
    await loadRuns();
    select(b.dataset.trace);
  });
}

// ---------- traces ----------
let runs = [], runsLoaded = false;
async function loadRuns() {
  runs = await (await fetch("/api/runs")).json();
  runsLoaded = true;
  const el = document.querySelector(".runs");
  if (!runs.length) { el.innerHTML = '<div class="empty" style="padding:20px">No traces yet.</div>'; return; }
  el.innerHTML = runs.map(r => `
    <div class="run" data-file="${esc(r.file)}">
      <div class="trow"><span style="font-weight:600">${esc(r.legal_name || r.subject || "?")}</span>
        <span class="pill ${esc(r.outcome)}">${esc(r.outcome ?? "—")}</span></div>
      <div class="meta">${esc(r.subject)} · ${r.seconds}s · ${r.llm_calls} calls · ${r.branches} branches</div>
    </div>`).join("");
  el.querySelectorAll(".run").forEach(n => n.onclick = () => select(n.dataset.file));
  if (runs[0]) select(runs[0].file);
}

async function select(file) {
  document.querySelectorAll(".run").forEach(n => n.classList.toggle("active", n.dataset.file === file));
  const r = await fetch(`/api/runs/${encodeURIComponent(file)}`);
  if (!r.ok) return;
  const { summary, events } = await r.json();
  renderTrace(summary, events);
}

function renderTrace(s, events) {
  const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  let html = `<div class="stats">
    ${stat("Vendor", esc(s.legal_name || s.subject))}
    ${stat("Decision", `<span class="pill ${esc(s.outcome)}">${esc(s.outcome ?? "—")}</span>`)}
    ${stat("Wall clock", s.seconds + "s")}
    ${stat("LLM calls", s.llm_calls)}
    ${stat("Reasoning tokens", (s.reasoning_tokens||0).toLocaleString())}
    ${stat("Branches", s.branches)}</div>`;

  const keep = ["agent.start","branch","verdict","tool.call","llm.result","adjudicator.out",
    "resolver.out","router.out","walker.hop","hmem.remember","router.override",
    "resolver.confidence_override","llm.degraded","walker.unavailable","run.end"];
  html += events.filter(e => keep.includes(e.kind)).map(e => {
    const t = (e.t ?? 0).toFixed(1) + "s"; let cls="", label=e.kind, what="", why="";
    switch (e.kind) {
      case "agent.start": cls="agent"; label="agent"; what=`<b>${esc(e.agent)}</b>`;
        why = e.tier ? `tier ${esc(e.tier)}, budget ${esc(e.budget)}` : ""; break;
      case "branch": cls="branch"; label="branch"; what=`<b>${esc(e.taken)}</b>`; why=esc(e.reason); break;
      case "verdict": label="critic"; what=`<b>${esc(e.verdict)}</b> (round ${esc(e.round)})`;
        why=esc((e.reasons||[]).join(" · ").slice(0,260)); break;
      case "tool.call": {
        const eng = /markovian|hmem/.test(e.tool); cls = eng ? "engine" : "";
        label = eng ? "meterless engine" : "tool"; what=`<code>${esc(e.tool)}</code>`;
        why = esc(Object.entries(e).filter(([k]) => !["t","run_id","kind","tool"].includes(k))
          .map(([k,v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ").slice(0,300));
        break; }
      case "llm.result": label="nemotron"; what=`${esc(e.agent)} · <code>${esc(e.tier)}</code>`;
        why=`${e.completion_tokens ?? "?"} tokens, ${e.reasoning_tokens ?? 0} reasoning`; break;
      case "walker.hop": cls="engine"; label="chain hop";
        what=`depth ${esc(e.depth)} — <b>${esc(e.name)}</b> (${esc(e.country)})`;
        why = e.sanctions_hit ? "LISTED ENTITY" : esc(e.relation); break;
      case "router.out": label="router"; what=`risk ${esc(e.risk_tier)}`; why=(e.signals||[]).join(", "); break;
      case "resolver.out": label="resolver"; what=`confidence ${esc(e.confidence)}`; why=`${esc(e.n)} candidate(s)`; break;
      case "resolver.confidence_override": label="guard"; what="confidence replaced with the computed score";
        why=`model said ${esc(e.model_said)}, computed ${esc(e.computed)}`; break;
      case "router.override": label="guard"; what="ambiguity refusal overridden"; why=esc(e.reason); break;
      case "llm.degraded": label="recovery"; what="answered without deliberation"; why=esc(e.reason); break;
      case "walker.unavailable": label="degraded"; what="chain walk unavailable"; why=esc(e.consequence); break;
      case "hmem.remember": cls="engine"; label="meterless engine";
        what=`<code>hmem.remember</code> ${esc(e.status)}`; why=esc(e.entity_id); break;
      case "adjudicator.out": label="adjudicator"; what=`<b>${esc(e.decision)}</b> confidence ${esc(e.confidence)}`;
        why=`tier ${esc(e.tier)}, budget ${esc(e.budget_spent)}`; break;
      case "run.end": label="end"; what=`<b>${esc(e.outcome)}</b>`;
        why=`evidence bar ${esc(e.evidence_bar)}, ${esc(e.rejections)} rejection(s)`; break;
    }
    return `<div class="ev2 ${cls}"><div class="t">${t}</div><div class="body">
      <div class="label">${esc(label)}</div><div>${what}</div>
      ${why ? `<div class="why">${why}</div>` : ""}</div></div>`;
  }).join("");

  html += `<details style="margin-top:18px"><summary style="color:var(--dim);cursor:pointer">
    ${events.length} raw JSONL events</summary>
    <pre>${esc(events.map(e => JSON.stringify(e)).join("\n"))}</pre></details>`;
  document.querySelector("main").innerHTML = html;
}

loadQueue();
</script>
<script>
// The legend tracks the tab: a reviewer on the queue needs different words
// from someone reading a trace, and a wrong caption is worse than none.
const LEGEND = {
  queue: `<span><b>Vendors needing a decision.</b> Triage cleared the rest without deliberation.
          Approve, or mark a wrong match &mdash; a correction persists and changes the next run.</span>`,
  traces: `<span><b>A completed screening run, step by step.</b> Left: every run. Right: its timeline.</span>
    <span class="key"><i class="swatch" style="background:var(--accent)"></i>agent turn</span>
    <span class="key"><i class="swatch" style="background:var(--branch)"></i><b>branch</b> &mdash; a decision point</span>
    <span class="key"><i class="swatch" style="background:var(--engine)"></i>Meterless engine</span>`,
};
function paintLegend() {
  const active = document.querySelector(".tab.on")?.dataset.view || "queue";
  const el = document.getElementById("legend");
  if (el) el.innerHTML = LEGEND[active] || "";
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTimeout(paintLegend, 0)));
paintLegend();
</script>
</body>
</html>
