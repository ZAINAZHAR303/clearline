[pytest]
# Confine collection to tests/.
#
# Without this, a bare `pytest` -- which is what the README tells a judge to
# run -- walks the repo root and collects smoke_test.py, because the name
# matches the default `*_test.py` pattern. That file is a CLI preflight, not a
# test module: it runs live Zetaris and Nemotron checks at import time and ends
# in `raise SystemExit`, which surfaces as pytest INTERNALERROR and no tests
# run at all. Run it directly instead: `python smoke_test.py`.
testpaths = tests
